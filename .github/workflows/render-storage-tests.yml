name: Render storage tests
on:
  push:
    branches: [master]
    paths: ['deploy/render/**', 'Dockerfile', 'render.yaml', '.github/workflows/render-storage-tests.yml']
  pull_request:
    paths: ['deploy/render/**', 'Dockerfile', 'render.yaml', '.github/workflows/render-storage-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  storage:
    runs-on: ubuntu-latest
    container: node:22.23.4-alpine
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: node --test deploy/render/*.test.mjs
